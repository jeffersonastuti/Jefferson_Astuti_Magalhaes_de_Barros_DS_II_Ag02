<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Colaboradores</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <main class="container">
        <section class="cartao">
            <h1>Cadastro de novo colaborador</h1>
            <p class="subtitulo">Lojas Brincos e Companhia</p>

            <form action="processaCadastro.php" method="POST">
                <div class="campo">
                    <label for="nome1">Nome completo</label>
                    <input type="text" id="nome1" name="nome1" required>
                </div>

                <div class="linha">
                    <div class="campo">
                        <label for="idade2">Idade</label>
                        <input type="number" id="idade2" name="idade2" min="16" max="100" required>
                    </div>

                    <div class="campo">
                        <label for="profissao3">Profissão</label>
                        <input type="text" id="profissao3" name="profissao3" required>
                    </div>
                </div>

                <div class="campo">
                    <label for="salario4">Salário pretendido (R$)</label>
                    <input type="number" id="salario4" name="salario4" min="0" step="0.01" required>
                </div>

                <div class="campo">
                    <label for="experiencia5">Experiência anterior</label>
                    <textarea id="experiencia5" name="experiencia5" rows="6" placeholder="Descreva resumidamente suas experiências profissionais anteriores." required></textarea>
                </div>

                <button type="submit">Enviar cadastro</button>
            </form>
        </section>
    </main>
</body>
</html>
